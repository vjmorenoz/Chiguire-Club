# Mantiene activo el proyecto gratuito de Supabase.
# El plan gratis pausa los proyectos tras 7 días sin actividad; esto hace
# una consulta cada 3 días. Requiere  los secrets SUPABASE_URL y
# SUPABASE_PUBLISHABLE_KEY (ver GUIA.md, paso 8).
name: Mantener Supabase activo

on:
  schedule:
    - cron: "17 12 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consultar el catálogo
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          curl --fail --silent --show-error \
            "$SUPABASE_URL/rest/v1/products?select=id&limit=1" \
            -H "apikey: $SUPABASE_KEY" > /dev/null
          echo "Supabase respondió correctamente"
